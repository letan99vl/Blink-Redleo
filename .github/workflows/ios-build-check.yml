name: Check BLINK REDLEO iOS

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build-check.yml'
  push:
    branches: [main, ios-testflight, ios-hybrid-fallback, testflight-handoff]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build-check.yml'

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
      - name: Generate project and icons
        working-directory: ios
        run: |
          python3 tools/make_icons.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path("BlinkRedleo/Assets.xcassets/AppIcon.appiconset/icon-1024.png")
          b = p.read_bytes()
          assert b[:8] == b"\x89PNG\r\n\x1a\n", "Invalid PNG signature"
          assert b[25] == 2, f"App Store icon must be RGB without alpha; PNG color type={b[25]}"
          print("App Store icon verified: RGB, no alpha channel")
          PY
          xcodegen generate
      - name: Build unsigned simulator app
        working-directory: ios
        run: |
          xcodebuild -project BlinkRedleo.xcodeproj -scheme BlinkRedleo -configuration Debug -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO build

      - name: Build unsigned device app and IPA
        working-directory: ios
        run: |
          set -euo pipefail
          rm -rf build-device Payload BLINK-REDLEO-unsigned.ipa
          xcodebuild -project BlinkRedleo.xcodeproj -scheme BlinkRedleo -configuration Release -sdk iphoneos -derivedDataPath build-device CODE_SIGNING_ALLOWED=NO build
          APP_PATH="build-device/Build/Products/Release-iphoneos/BLINK REDLEO.app"
          test -d "$APP_PATH"

          INDEX_PATH="$(find "$APP_PATH" -name index.html -type f -print -quit)"
          PROTOCOL_PATH="$(find "$APP_PATH" -name redleo_real_protocol.js -type f -print -quit)"
          test -n "$INDEX_PATH"
          test -n "$PROTOCOL_PATH"
          test "$(dirname "$INDEX_PATH")" = "$(dirname "$PROTOCOL_PATH")"
          if grep -R -q 'letan99vl.github.io/Blink-Redleo' "$APP_PATH"; then
            echo "Runtime bundle still contains GitHub Pages UI URL"
            exit 1
          fi
          grep -q "ios-native-remote-first" "$INDEX_PATH"
          grep -q "window.BLINK_PB_VERSION = '3.79.115'" "$INDEX_PATH"
          grep -q 'MARKETING_VERSION: "1.0"' project.yml
          grep -q 'CURRENT_PROJECT_VERSION: "115"' project.yml
          grep -q 'applicationNameForUserAgent = "BLINK-REDLEO-IOS/1.0"' BlinkRedleo/MainViewController.swift
          grep -q 'data-mirror="ign"' "$INDEX_PATH"
          grep -q 'data-mirror="pw"' "$INDEX_PATH"
          grep -q 'function mapSaveArrowMode()' "$INDEX_PATH"
          grep -q 'const angleHeat=(f.id=' "$INDEX_PATH"
          grep -q '#mapFloatSaveBtn.saveCorrected' "$INDEX_PATH"
          if grep -q 'id="fuelSmoothBtn"' "$INDEX_PATH"; then
            echo "ERROR: duplicate top-bar I smooth button reintroduced"
            exit 1
          fi
          grep -q "window.BlinkRealProtocol" "$PROTOCOL_PATH"
          grep -q "raw.githubusercontent.com/letan99vl/Blink-Redleo/main/redleo_real_protocol.js" BlinkRedleo/MainViewController.swift
          if grep -q "const src='redleo_real_protocol.js?v=" "$INDEX_PATH"; then
            echo "ERROR: Duplicate embedded HTML protocol loader; iOS should inject remote-first."
            exit 1
          fi
          echo "PB3.79.115 TestFlight hybrid verified: bundled UI + native CoreBluetooth + production remote protocol + local fallback"

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          /usr/bin/zip -qry BLINK-REDLEO-unsigned.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: BLINK-REDLEO-iOS-unsigned
          path: ios/BLINK-REDLEO-unsigned.ipa
          if-no-files-found: error
