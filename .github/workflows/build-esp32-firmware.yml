name: Build ESP32 Bridge Firmware

on:
  push:
    branches: [ main ]
    paths:
      - 'firmware/2.2.ino'
      - 'firmware/2.5.ino'
      - 'tools/check-fw25-guard-compat.js'
      - '.github/workflows/build-esp32-firmware.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'firmware/2.2.ino'
      - 'firmware/2.5.ino'
      - 'tools/check-fw25-guard-compat.js'
      - '.github/workflows/build-esp32-firmware.yml'
  workflow_dispatch:
    inputs:
      publish_ota:
        description: 'Explicitly publish compiled current firmware to public OTA (FW2.5)'
        type: boolean
        required: true
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify unchanged FW2.2/FW2.5, safety cores and PB3.79.72 before compilation
        run: |
          python3 tools/extract-fw24-cores.py firmware/2.5.ino /tmp/fw24_extracted.h
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -I /tmp tools/test-fw24-autopin.cpp -o /tmp/fw24-release-tests
          /tmp/fw24-release-tests
          node tools/check-fw25-guard-compat.js
          node tools/check-afr-target-keypad-backport.js
          node tools/check-ota-server-pause.js
          node --check redleo_real_protocol.js

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core
        run: |
          arduino-cli config init
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.12

      - name: Prepare single-file FW2.5 sketch
        run: |
          mkdir -p build-sketch/BLINK_FW
          cp firmware/2.5.ino build-sketch/BLINK_FW/BLINK_FW.ino

      - name: Compile FW2.5 firmware
        run: |
          mkdir -p build-out
          arduino-cli compile \
            --fqbn esp32:esp32:esp32:PartitionScheme=min_spiffs \
            --output-dir build-out \
            build-sketch/BLINK_FW
          test -s build-out/BLINK_FW.ino.bin

      - name: Upload firmware build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BLINK_FW25_BUILD
          path: build-out/BLINK_FW.ino.bin

      - name: Publish OTA binary and manifest (explicit release only)
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish_ota == true) || (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[RELEASE_FW25]')) }}
        run: |
          cp build-out/BLINK_FW.ino.bin ota/blink_esp32.bin
          python3 - <<'PY'
          import hashlib, json, re
          from pathlib import Path

          bin_path = Path('ota/blink_esp32.bin')
          manifest_path = Path('ota/manifest.json')
          firmware_source = Path('firmware/2.5.ino').read_text(encoding='utf-8')
          match = re.search(r'^#define FW_VERSION\s+"([^"]+)"', firmware_source, flags=re.MULTILINE)
          if not match or match.group(1) != '2.5':
              raise SystemExit('Refusing to publish: production release must be FW2.5')
          version = match.group(1)
          sha = hashlib.sha256(bin_path.read_bytes()).hexdigest()
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['version'] = version
          manifest['url'] = 'https://raw.githubusercontent.com/letan99vl/Blink-Redleo/main/ota/blink_esp32.bin'
          manifest['sha256'] = sha
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('FW '+version+' sha256', sha)
          PY

      - name: Commit OTA firmware (explicit release only)
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish_ota == true) || (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[RELEASE_FW25]')) }}
        run: |
          if git diff --quiet -- ota/blink_esp32.bin ota/manifest.json; then
            echo "OTA firmware already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ota/blink_esp32.bin ota/manifest.json
          git commit -m "Publish ESP32 FW 2.5 OTA binary [OTA_RELEASED]"
          git pull --rebase origin main
          git push
