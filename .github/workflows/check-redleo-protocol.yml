name: Check REDLEO Protocol JS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'redleo_real_protocol.js'
      - 'tools/check-row-orientation.js'
      - 'tools/check-v92-page6.js'
      - 'tools/check-v10-page6.js'
      - '.github/workflows/check-redleo-protocol.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: node --check redleo_real_protocol.js
      - name: Compensation row orientation regression
        run: node tools/check-row-orientation.js
      - name: REDLEO 9.2 page6 regression
        run: node tools/check-v92-page6.js
      - name: REDLEO V10.2 page6 regression
        run: node tools/check-v10-page6.js
