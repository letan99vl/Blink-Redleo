name: Build BLINK REDLEO APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-apk.yml'
      - 'android/android-app-source.b64'
      - 'tools/patch_v11.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply web v11 patch
        run: |
          python3 tools/patch_v11.py
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Apply Blink web v11 fixes"
            git push
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android licenses and install SDK
        shell: bash
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android source
        run: |
          rm -rf android-build
          mkdir android-build
          base64 -d android/android-app-source.b64 > /tmp/android-app-source.zip
          unzip -q /tmp/android-app-source.zip -d android-build
          SRC=android-build/app/src/main/java/vn/blinkredleo/app/MainActivity.java
          sed -i 's/@Override protected void onWindowFocusChanged/@Override public void onWindowFocusChanged/' "$SRC"
          sed -i '/requestWindowFeature(Window.FEATURE_NO_TITLE);/d' "$SRC"
          sed -i '/s.setDatabaseEnabled(true);/d' "$SRC"
          sed -i '/s.setSafeBrowsingEnabled(true);/d' "$SRC"
          sed -i 's/        enterImmersive();/        try { enterImmersive(); } catch (Throwable ignored) {}/' "$SRC"
          sed -i 's/        BluetoothManager bm = (BluetoothManager) getSystemService(Context.BLUETOOTH_SERVICE);/        BluetoothManager bm = null;/' "$SRC"
          sed -i 's/        bluetoothAdapter = bm != null ? bm.getAdapter() : null;/        bluetoothAdapter = null;/' "$SRC"
          sed -i '/    private void ensurePermissionsThenConnect(boolean auto) {/a\        if (bluetoothAdapter == null) { try { BluetoothManager bm = (BluetoothManager) getSystemService(Context.BLUETOOTH_SERVICE); bluetoothAdapter = bm != null ? bm.getAdapter() : null; } catch (Throwable ignored) {} }' "$SRC"
          python3 android/add_ble_picker.py "$SRC"
          sed -i 's#https://letan99vl.github.io/Blink-Redleo/?android=1#https://letan99vl.github.io/Blink-Redleo/?android=1\&v=11#' "$SRC"
          sed -i 's/WebSettings.LOAD_DEFAULT/WebSettings.LOAD_NO_CACHE/' "$SRC"
          sed -i 's/BLINK-REDLEO-ANDROID\/1.1/BLINK-REDLEO-ANDROID\/1.3-v11/' "$SRC"
          sed -i '/s.setCacheMode(WebSettings.LOAD_NO_CACHE);/a\            try { webView.clearCache(true); webView.clearHistory(); } catch (Throwable ignored) {}' "$SRC"
          echo "===== ANDROID BLE SOURCE DIAGNOSTIC ====="
          grep -n -C 8 -E "connectGatt|onConnectionStateChange|onServicesDiscovered|onMtuChanged|writeCharacteristic|WRITE_TYPE_" "$SRC" || true
          echo "===== NATIVE BRIDGE JS DIAGNOSTIC ====="
          grep -n -C 10 -E "writeValueWithResponse|writeValueWithoutResponse|writeValue|AndroidBLE|Promise|queue" android-build/app/src/main/assets/native_bridge.js || true

      - name: Build signed release APK
        working-directory: android-build
        run: gradle --no-daemon assembleRelease

      - name: Prepare APK
        run: |
          cp android-build/app/build/outputs/apk/release/app-release.apk BLINK-REDLEO.apk
          sha256sum BLINK-REDLEO.apk | tee BLINK-REDLEO.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BLINK-REDLEO-APK-v11
          path: |
            BLINK-REDLEO.apk
            BLINK-REDLEO.apk.sha256
          if-no-files-found: error
