name: Runtime MAP navigation smoke test

on:
  push:
    branches:
      - feature/debug-map-nav-pb37977-20261013
    paths:
      - index.html
      - tools/check-map-nav-runtime.js
      - tools/check-map-nav-browser.js
      - .github/workflows/check-map-nav-runtime.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-dom-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install isolated DOM test dependency
        run: npm install --no-save --no-package-lock --omit=dev jsdom@26 playwright-core@1.56.0
      - name: Validate full MAP navigation runtime
        run: node tools/check-map-nav-runtime.js

      - name: Test actual Chrome clicks and editor visibility
        run: |
          command -v google-chrome || command -v google-chrome-stable || command -v chromium
          python3 -m http.server 8787 --bind 127.0.0.1 >/tmp/blink-local-http.log 2>&1 &
          WEB_PID=$!
          trap 'kill $WEB_PID || true' EXIT
          node tools/check-map-nav-browser.js
