name: FW2.6.2 Ultra Pro1 Auth (LAB ONLY)
on:
  push:
    branches:
      - feature/blink-fw24-autopin-redline5s-20261013
      - feature/blink-fw26-multifamily-guard-20261013
      - feature/blink-fw262-ultra-pro1-handshake-20261014
    paths:
      - 'firmware/ESP32_BLINK_TL_REDLEO_REAL_BRIDGE_GPIO26_33.ino'
      - 'index.html'
      - 'tools/extract-fw24-cores.py'
      - 'tools/test-fw24-autopin.cpp'
      - 'tools/test-fw24-ui.js'
      - '.github/workflows/check-fw24-autopin-redline5s.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware-lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test actual INO core for pin detection / redline timing
        run: |
          python3 tools/extract-fw24-cores.py firmware/ESP32_BLINK_TL_REDLEO_REAL_BRIDGE_GPIO26_33.ino /tmp/fw24_extracted.h
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -I /tmp tools/test-fw24-autopin.cpp -o /tmp/fw24-tests
          /tmp/fw24-tests
      - name: Validate Ultra Pro1 0x5A compatibility and Blink UI safety
        run: |
          node tools/test-fw24-ui.js
          node --check redleo_real_protocol.js
      - uses: arduino/setup-arduino-cli@v2
      - name: Install classic ESP32 Arduino core
        run: |
          arduino-cli config init
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.12
      - name: Compile FW2.6.2 one-file - no customer OTA
        run: |
          mkdir -p build-sketch/BLINK_FW build-out
          cp firmware/ESP32_BLINK_TL_REDLEO_REAL_BRIDGE_GPIO26_33.ino build-sketch/BLINK_FW/BLINK_FW.ino
          arduino-cli compile \
            --fqbn esp32:esp32:esp32:PartitionScheme=min_spiffs \
            --output-dir build-out \
            build-sketch/BLINK_FW
          test -s build-out/BLINK_FW.ino.bin
          sha256sum build-out/BLINK_FW.ino.bin > build-out/FW262-SHA256.txt
          cp build-sketch/BLINK_FW/BLINK_FW.ino build-out/BLINK_FW262_SINGLE_FILE.ino
          printf 'FW2.6.2 ULTRA PRO1 0x5A AUTH LAB - NOT PRODUCTION OTA.\nUse ignition ON and motor OFF. First verify ECU 0x5A auth and MAP reads; this build is NOT real-hardware verified.\nBootloader+partition may also be required for full chip erase flash.\nRedline Guard must stay OFF until its four page6 limits are verified.\nDo not test at sustained redline on public roads.\n' > build-out/READ-ME-FIRST.txt
      - uses: actions/upload-artifact@v4
        with:
          name: BLINK_FW262_ULTRAPRO1_5A_LAB
          path: |
            build-out/BLINK_FW.ino.bin
            build-out/BLINK_FW262_SINGLE_FILE.ino
            build-out/FW262-SHA256.txt
            build-out/READ-ME-FIRST.txt
          retention-days: 30
